name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: rust engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
        working-directory: core
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: core
      - run: cargo test
        working-directory: core

  proofs:
    name: lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "proofs"
          build: true
          use-mathlib-cache: true
          test: false
          lint: false

      - name: nothing may be assumed
        working-directory: proofs
        run: |
          printf 'import Proofs\n#print axioms Kosmos.hasDerivAt_eval\n#print axioms Kosmos.simplify_eval\n' > axioms.lean
          lake env lean axioms.lean | tee axioms.out
          if grep -q sorryAx axioms.out; then
            echo "::error::a proof still depends on sorry"
            exit 1
          fi

      - name: the shipped corpus must match the proofs
        working-directory: proofs
        run: |
          lake env lean --run Proofs/Bridge.lean > regenerated.txt
          diff --strip-trailing-cr -u ../core/tests/verified-derivatives.txt regenerated.txt

  algebra:
    name: ocaml algebra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install the compiler
        run: sudo apt-get update -qq && sudo apt-get install -y ocaml ocaml-findlib js-of-ocaml

      - name: the module must agree with itself
        run: bash cas/test.sh

      - name: the shipped bundle must behave
        run: node cas/check.mjs

      - name: rebuilding must not change the answers
        run: |
          bash cas/build.sh /tmp/cas.js
          node cas/check.mjs /tmp/cas.js

  web:
    name: wasm + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build the engine
        run: wasm-pack build --release --target web --out-dir ../web/src/wasm --out-name kosmos
        working-directory: core

      - run: rm -f web/src/wasm/.gitignore
      - run: npm ci --include=dev
        working-directory: web
      - run: npx tsc -b --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: github pages
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  image:
    name: container image
    needs: engine
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kosmos:latest
            ghcr.io/${{ github.repository_owner }}/kosmos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
