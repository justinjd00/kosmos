[package]
name = "kosmos-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Numerical core of kosmos: expression engine, calculus and simulations"
repository = "https://github.com/justinjd00/kosmos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
